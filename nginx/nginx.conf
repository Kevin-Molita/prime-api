# Balanceador de carga para las dos instancias de la API
events {}

http {
  # Registro con la instancia que atendió y el tiempo de respuesta
  log_format prime '$time_iso8601 cliente_ip=$remote_addr "$request" '
                   'estado=$status instancia=$upstream_addr '
                   'tiempo=$request_time s';
  access_log /var/log/nginx/access.log prime;

  # Límite de peticiones por IP (protección básica)
  limit_req_zone $binary_remote_addr zone=por_ip:10m rate=20r/s;

  upstream api_servers {
    # Reparto round robin; si una instancia falla, se saca de rotación
    server api1:3000 max_fails=2 fail_timeout=10s;
    server api2:3000 max_fails=2 fail_timeout=10s;
  }

  server {
    listen 80;
    server_tokens off;

    location / {
      limit_req zone=por_ip burst=40 nodelay;
      proxy_pass http://api_servers;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 2s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
