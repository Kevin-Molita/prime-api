# .github/workflows/cd.yml
# Entrega continua: cuando CI pasa en main, publica la imagen y la despliega.
name: CD - Prime API

on:
  workflow_run:
    workflows: ["CI - Prime API"]
    branches: [main]
    types: [completed]

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/prime-api
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} ./api
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

  deploy:
    needs: publish
    # Runner autoalojado instalado en el PC con Docker Desktop
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        shell: powershell
        run: |
          "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Desplegar con docker compose
        shell: powershell
        run: |
          docker compose pull
          docker compose up -d
          docker compose ps

      - name: Verificar que las dos instancias queden saludables
        shell: powershell
        run: |
          Start-Sleep -Seconds 15
          docker compose ps
          (Invoke-WebRequest -UseBasicParsing http://localhost:8080/health).StatusCode
