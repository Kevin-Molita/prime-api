# .github/workflows/ci.yml
# Integración continua: se ejecuta en cada push y pull request a main.
name: CI - Prime API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir la imagen Docker de la API
        run: docker build -t prime-api:ci ./api

      - name: Levantar la API para las pruebas
        run: |
          docker run -d --name prime-api-ci -p 3000:3000 \
            -e INSTANCE_NAME=api-ci \
            -e CLIENT_KEYS=clienteTest:clave-de-prueba \
            prime-api:ci
          # Esperar hasta 30 s a que la API responda
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break || sleep 1
          done

      - name: Prueba - /health debe dar 200
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          echo "Respuesta /health: $code"
          test "$code" = "200"

      - name: Prueba - sin clave debe dar 401
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/productos)
          echo "Respuesta sin clave: $code"
          test "$code" = "401"

      - name: Prueba - clave falsa debe dar 401
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-api-key: clave-falsa" http://localhost:3000/api/productos)
          echo "Respuesta con clave falsa: $code"
          test "$code" = "401"

      - name: Prueba - clave válida debe dar 200
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-api-key: clave-de-prueba" http://localhost:3000/api/productos)
          echo "Respuesta con clave válida: $code"
          test "$code" = "200"

      - name: Prueba - producto inexistente debe dar 404
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-api-key: clave-de-prueba" http://localhost:3000/api/productos/999)
          echo "Respuesta producto inexistente: $code"
          test "$code" = "404"

      - name: Mostrar logs si algo falla
        if: failure()
        run: docker logs prime-api-ci
