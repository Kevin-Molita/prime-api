# .github/workflows/ci.yml
# Integración continua: se ejecuta en cada push y pull request a main.
name: CI - Prime API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir la imagen Docker de la API
        run: docker build -t prime-api:ci .

      - name: Levantar la API para las pruebas
        run: |
          docker run -d --name prime-api-ci -p 3000:3000 \
            -e API_KEY=clave-de-prueba prime-api:ci
          # Esperar hasta 30 s a que la API responda
          for i in $(seq 1 30); do
            curl -s http://localhost:3000/health && break || sleep 1
          done

      - name: Prueba de humo - sin clave debe dar 401
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          echo "Respuesta sin clave: $code"
          test "$code" = "401"

      - name: Prueba de humo - con clave válida debe dar 200
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-api-key: clave-de-prueba" http://localhost:3000/)
          echo "Respuesta con clave: $code"
          test "$code" = "200"

      - name: Mostrar logs si algo falla
        if: failure()
        run: docker logs prime-api-ci
